<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AARNA Cross-Domain Sync Bridge</title>
</head>
<body>
  <script>
    (function() {
      'use strict';

      // Allowed origins for communication
      const ALLOWED_ORIGINS = [
        'https://www.aarnaus.com',
        'https://aarnaus.com',
        'https://aarna-site.vercel.app'
      ];

      function isOriginAllowed(origin) {
        if (!origin) return false;
        if (ALLOWED_ORIGINS.includes(origin)) return true;
        if (/^http:\/\/localhost(:\d+)?$/.test(origin)) return true;
        if (/^http:\/\/127\.0\.0\.1(:\d+)?$/.test(origin)) return true;
        if (origin.endsWith('.vercel.app')) return true;
        return false;
      }

      window.addEventListener('message', function(event) {
        if (!isOriginAllowed(event.origin)) return;

        const msg = event.data;
        if (!msg || typeof msg !== 'object') return;

        if (msg.action === 'GET_SYNC_DATA') {
          try {
            const content = localStorage.getItem('aarna_site_content_v2') || localStorage.getItem('aarna_site_content');
            const media = localStorage.getItem('aarna_site_media');
            const retail = localStorage.getItem('aarna_products_retail_v2') || localStorage.getItem('aarna_products_retail');
            const institutional = localStorage.getItem('aarna_products_institutional_v2') || localStorage.getItem('aarna_products_institutional');
            const devices = localStorage.getItem('aarna_products_devices_v2') || localStorage.getItem('aarna_products_devices');
            const inquiries = localStorage.getItem('aarna_contact_inquiries');

            const payload = {
              content: content ? JSON.parse(content) : null,
              media: media ? JSON.parse(media) : null,
              retail: retail ? JSON.parse(retail) : null,
              institutional: institutional ? JSON.parse(institutional) : null,
              devices: devices ? JSON.parse(devices) : null,
              inquiries: inquiries ? JSON.parse(inquiries) : null,
              originFrom: window.location.origin
            };

            event.source.postMessage({
              type: 'AARNA_SYNC_DATA_RESPONSE',
              payload: payload,
              requestId: msg.requestId || null
            }, event.origin);
          } catch (err) {
            console.warn('Sync Bridge Error reading data:', err);
            event.source.postMessage({
              type: 'AARNA_SYNC_DATA_RESPONSE',
              error: err.message,
              requestId: msg.requestId || null
            }, event.origin);
          }
        } else if (msg.action === 'SAVE_SYNC_DATA' && msg.payload) {
          try {
            const p = msg.payload;
            if (p.content) {
              localStorage.setItem('aarna_site_content_v2', JSON.stringify(p.content));
              localStorage.setItem('aarna_site_content', JSON.stringify(p.content));
            }
            if (p.media) {
              localStorage.setItem('aarna_site_media', JSON.stringify(p.media));
            }
            if (p.retail) {
              localStorage.setItem('aarna_products_retail_v2', JSON.stringify(p.retail));
            }
            if (p.institutional) {
              localStorage.setItem('aarna_products_institutional_v2', JSON.stringify(p.institutional));
            }
            if (p.devices) {
              localStorage.setItem('aarna_products_devices_v2', JSON.stringify(p.devices));
            }

            event.source.postMessage({
              type: 'AARNA_SAVE_RESPONSE',
              success: true,
              requestId: msg.requestId || null
            }, event.origin);
          } catch (err) {
            event.source.postMessage({
              type: 'AARNA_SAVE_RESPONSE',
              success: false,
              error: err.message,
              requestId: msg.requestId || null
            }, event.origin);
          }
        }
      });

      // Signal ready state to parent if embedded
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'AARNA_BRIDGE_READY' }, '*');
      }
    })();
  </script>
</body>
</html>
