<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | AARNA USA</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="assets/logos/aarna-logo-clean.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=4.2">
  <style>
    .notfound-hero {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(4rem, 8vw, 8rem) 1.5rem;
    }
    .notfound-box {
      max-width: 600px;
      margin: 0 auto;
    }
    .notfound-code {
      font-family: var(--font-heading);
      font-size: clamp(4rem, 10vw, 7rem);
      font-weight: 800;
      color: #061e47;
      line-height: 1;
      margin-bottom: 0.5rem;
      letter-spacing: -0.04em;
    }
    .notfound-title {
      font-family: var(--font-heading);
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 700;
      color: #0b1523;
      margin-bottom: 1rem;
    }
    .notfound-desc {
      font-size: 1.1rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .notfound-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <!-- SITE HEADER -->
  <header class="site-header" id="site-header">
    <div class="container header-container">
      <a href="index.html" class="brand-logo" aria-label="AARNA USA Homepage">
        <img src="assets/logos/aarna-logo-custom.webp" data-cms-media="logo_main" alt="AARNA USA Logo" width="130" height="44">
      </a>
      <nav class="main-nav" aria-label="Main Navigation">
        <div class="nav-pill-group">
          <a href="index.html" class="nav-link">Home</a>
          <a href="about.html" class="nav-link">About Us</a>
          <a href="contact.html" class="nav-link">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="notfound-hero">
      <div class="container notfound-box">
        <div class="notfound-code">404</div>
        <h1 class="notfound-title">Page Not Found</h1>
        <p class="notfound-desc">The healthcare or pharmaceutical page you are looking for may have been moved, renamed, or is temporarily unavailable.</p>
        <div class="notfound-actions">
          <a href="index.html" class="btn btn-primary">Return to Homepage</a>
          <a href="contact.html" class="btn btn-secondary">Contact Support</a>
        </div>
      </div>
    </section>
  </main>

  <!-- SITE FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <div style="text-align: center; padding: 2rem 0; color: #94a3b8; font-size: 0.9rem;">
        &copy; 2026 AARNA USA Inc. All rights reserved.
      </div>
    </div>
  </footer>

</body>
</html>
